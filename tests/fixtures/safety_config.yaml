# Safety config used in tests/conftest.py and integration tests.
# Reviewed by construction: these are a fixture's limits, not a rig's.
schema_version: 2
reviewed: true
rig_profile:
  mode: guaranteed
  actuators:
    - {source: core_xy, capability: stage-position, axis: x}
    - {source: core_xy, capability: stage-position, axis: y}
    - {source: core_focus, capability: stage-position, axis: z}
  classifications:
    - {kind: built_in_typed_capability, capability: stage-position}
    - {kind: built_in_typed_capability, capability: exposure}
stage:
  x_min: -1000.0
  x_max:  1000.0
  y_min: -1000.0
  y_max:  1000.0
  z_min:  0.0
  z_max:  200.0

camera:
  max_exposure_ms: 2000.0

channels:
  allowed: [DAPI, FITC, Cy5]

allowed_properties: []
