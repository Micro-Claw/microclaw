<!--
  Microclaw history viewer.

  Standalone: open this file in a browser and drop a *_microclaw_history.json
  onto it. Launched via `microclaw view-history <file>`, the CLI substitutes the
  run's JSON into the data script below so it renders immediately.
-->
<style>
  :root {
    --bg:        #f6f8f9;
    --panel:     #ffffff;
    --ink:       #16201f;
    --ink-soft:  #4a5a58;
    --ink-faint: #7c8c8a;
    --line:      #dde5e4;
    --line-soft: #e9eeed;
    --accent:    #0d7c88;
    --accent-2:  #0a5f69;
    --user-bg:   #e7f2f3;
    --user-line: #bcdadd;
    --tool-bg:   #f3efe7;
    --tool-line: #e0d6c0;
    --tool-ink:  #8a6d1f;
    --result-bg: #eef1f0;
    --shadow:    0 1px 2px rgba(20,40,40,.05), 0 6px 18px rgba(20,40,40,.05);
    --mono: ui-monospace, "SF Mono", "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #0e1413;
      --panel:     #151d1c;
      --ink:       #e4ecea;
      --ink-soft:  #a3b4b1;
      --ink-faint: #6c7d7a;
      --line:      #253230;
      --line-soft: #1d2726;
      --accent:    #34c1cf;
      --accent-2:  #6ad6e1;
      --user-bg:   #14302f;
      --user-line: #1f4a48;
      --tool-bg:   #2a2416;
      --tool-line: #453a1f;
      --tool-ink:  #d9bd6e;
      --result-bg: #1a2322;
      --shadow:    0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --bg:#f6f8f9; --panel:#ffffff; --ink:#16201f; --ink-soft:#4a5a58; --ink-faint:#7c8c8a;
    --line:#dde5e4; --line-soft:#e9eeed; --accent:#0d7c88; --accent-2:#0a5f69;
    --user-bg:#e7f2f3; --user-line:#bcdadd; --tool-bg:#f3efe7; --tool-line:#e0d6c0;
    --tool-ink:#8a6d1f; --result-bg:#eef1f0; --shadow:0 1px 2px rgba(20,40,40,.05), 0 6px 18px rgba(20,40,40,.05);
  }
  :root[data-theme="dark"] {
    --bg:#0e1413; --panel:#151d1c; --ink:#e4ecea; --ink-soft:#a3b4b1; --ink-faint:#6c7d7a;
    --line:#253230; --line-soft:#1d2726; --accent:#34c1cf; --accent-2:#6ad6e1;
    --user-bg:#14302f; --user-line:#1f4a48; --tool-bg:#2a2416; --tool-line:#453a1f;
    --tool-ink:#d9bd6e; --result-bg:#1a2322; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* ---- header ---- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 12px clamp(14px, 4vw, 40px);
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  .brand h1 {
    font-size: 17px; margin: 0; letter-spacing: -.01em; font-weight: 650;
  }
  .brand .glyph { color: var(--accent); font-size: 15px; }
  .brand .sub {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ink-faint); font-weight: 600;
  }
  .stats { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
  .stat { display: flex; flex-direction: column; line-height: 1.1; }
  .stat b { font-size: 15px; font-weight: 650; }
  .stat span { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-faint); font-weight: 600; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button, .filebtn {
    font-family: var(--sans); font-size: 12.5px; font-weight: 550;
    color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; transition: border-color .12s, background .12s;
  }
  button:hover, .filebtn:hover { border-color: var(--accent); }
  button:focus-visible, .filebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filebtn.primary { background: var(--accent); color: #04191b; border-color: var(--accent); }
  input[type=file] { display: none; }

  /* ---- main ---- */
  main { max-width: 820px; margin: 0 auto; padding: 28px clamp(14px, 4vw, 40px) 120px; }

  /* drop / empty state */
  #drop {
    margin-top: 6vh; border: 1.5px dashed var(--line); border-radius: 16px;
    padding: 56px 32px; text-align: center; background: var(--panel);
    transition: border-color .15s, background .15s;
  }
  #drop.hot { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
  #drop .big { font-size: 21px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 8px; }
  #drop p { color: var(--ink-soft); font-size: 14px; margin: 6px auto; max-width: 46ch; }
  #drop .hint { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin-top: 18px; }
  #drop .filebtn { display: inline-block; margin-top: 20px; }

  /* turns */
  .turn { margin: 0; padding: 3px 0; }
  .role-tag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
    color: var(--ink-faint); margin: 22px 0 7px;
  }
  .role-tag .dot { width: 7px; height: 7px; border-radius: 50%; }
  .role-user  .dot { background: var(--accent); }
  .role-asst  .dot { background: var(--ink-faint); }

  .bubble {
    border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow);
    font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word;
  }
  .bubble.user { background: var(--user-bg); border: 1px solid var(--user-line); }
  .bubble.asst { background: var(--panel); border: 1px solid var(--line); }
  .bubble p { margin: 0 0 .6em; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble code {
    font-family: var(--mono); font-size: .88em;
    background: color-mix(in srgb, var(--ink) 8%, transparent);
    padding: 1px 5px; border-radius: 5px;
  }
  .bubble strong { font-weight: 650; }

  /* tool call */
  details.tool {
    margin: 8px 0; border: 1px solid var(--tool-line); border-radius: 10px;
    background: var(--tool-bg); overflow: hidden;
  }
  details.tool > summary {
    list-style: none; cursor: pointer; padding: 9px 14px;
    display: flex; align-items: center; gap: 10px; user-select: none;
  }
  details.tool > summary::-webkit-details-marker { display: none; }
  .chev { color: var(--tool-ink); transition: transform .15s; flex: none; font-size: 11px; }
  details.tool[open] .chev { transform: rotate(90deg); }
  .tool-badge {
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: var(--tool-ink);
    border: 1px solid var(--tool-line); border-radius: 5px; padding: 1px 6px; flex: none;
  }
  .tool-name { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); }
  .tool-preview { color: var(--ink-faint); font-size: 12px; font-family: var(--mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool-body { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 10px; }
  .kv-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
    color: var(--ink-faint); margin-bottom: 4px; }
  pre.json {
    margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.5;
    background: var(--result-bg); border: 1px solid var(--line-soft); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; white-space: pre; color: var(--ink-soft);
  }
  pre.json.result { border-left: 3px solid var(--accent); }
  .err-badge { color: #c0392b; }
  :root[data-theme="dark"] .err-badge { color: #ff8a80; }

  footer { text-align: center; color: var(--ink-faint); font-size: 11.5px; padding: 30px 0 60px; }
  .hidden { display: none !important; }
</style>

<header>
  <div class="brand">
    <span class="glyph">◉</span>
    <h1>Microclaw Transcript</h1>
    <span class="sub">history viewer</span>
  </div>
  <div class="stats hidden" id="stats">
    <div class="stat"><b id="s-turns">0</b><span>turns</span></div>
    <div class="stat"><b id="s-tools">0</b><span>tool calls</span></div>
  </div>
  <div class="controls">
    <label class="filebtn" tabindex="0" role="button" id="openlbl">Open file
      <input type="file" id="file" accept=".json,application/json">
    </label>
    <button id="expand" class="hidden">Expand all</button>
    <button id="collapse" class="hidden">Collapse all</button>
    <button id="theme" title="Toggle theme">◐</button>
  </div>
</header>

<main>
  <div id="drop">
    <div class="big">Drop a history JSON here</div>
    <p>Renders a <code>*_microclaw_history.json</code> run as a readable conversation — user prompts, the agent's replies, and every microscope tool call with its result.</p>
    <p class="hint">Everything stays in your browser. No upload.</p>
    <label class="filebtn primary" tabindex="0" role="button">Choose file
      <input type="file" accept=".json,application/json" onchange="window.__load(this.files[0])">
    </label>
  </div>
  <div id="transcript"></div>
</main>

<footer id="foot" class="hidden"></footer>

<!-- The CLI substitutes the run's JSON for the token below. Left as-is when opened standalone. -->
<script id="history-data" type="application/json">__MICROCLAW_HISTORY_DATA__</script>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const drop = $("drop"), tx = $("transcript");

  // ---- theme toggle ----
  const root = document.documentElement;
  $("theme").addEventListener("click", () => {
    const cur = root.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    root.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
  });

  // ---- helpers ----
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

  // tiny inline markdown: **bold**, `code`, paragraphs
  function md(text) {
    return esc(text)
      .split(/\n{2,}/)
      .map(p => "<p>" + p
        .replace(/\n/g, "<br>")
        .replace(/`([^`]+)`/g, (_, c) => "<code>" + c + "</code>")
        .replace(/\*\*([^*]+)\*\*/g, (_, b) => "<strong>" + b + "</strong>")
        + "</p>")
      .join("");
  }

  function fmtJSON(val) {
    let obj = val;
    if (typeof val === "string") {
      try { obj = JSON.parse(val); } catch { return esc(val); }
    }
    return esc(JSON.stringify(obj, null, 2));
  }

  function preview(input) {
    const s = typeof input === "string" ? input : JSON.stringify(input);
    if (!s || s === "{}" || s === "null") return "";
    return s.length > 90 ? s.slice(0, 90) + "…" : s;
  }

  // build one collapsible tool card
  function toolCard(block, result) {
    const det = document.createElement("details");
    det.className = "tool";
    const isErr = result && result.is_error;
    det.innerHTML =
      '<summary>' +
        '<span class="chev">▶</span>' +
        '<span class="tool-badge' + (isErr ? " err-badge" : "") + '">' + (isErr ? "error" : "tool") + '</span>' +
        '<span class="tool-name">' + esc(block.name) + '</span>' +
        '<span class="tool-preview">' + esc(preview(block.input)) + '</span>' +
      '</summary>';
    const body = document.createElement("div");
    body.className = "tool-body";
    if (block.input && Object.keys(block.input).length) {
      body.innerHTML += '<div><div class="kv-label">Input</div><pre class="json">' + fmtJSON(block.input) + '</pre></div>';
    }
    if (result !== undefined) {
      body.innerHTML += '<div><div class="kv-label">Result</div><pre class="json result">' + fmtJSON(result.content) + '</pre></div>';
    } else {
      body.innerHTML += '<div><div class="kv-label">Result</div><pre class="json">(no result recorded)</pre></div>';
    }
    det.appendChild(body);
    return det;
  }

  function roleTag(cls, label) {
    const d = document.createElement("div");
    d.className = "role-tag role-" + cls;
    d.innerHTML = '<span class="dot"></span>' + label;
    return d;
  }

  // ---- main render ----
  function render(history) {
    if (!Array.isArray(history)) throw new Error("Top level is not an array of messages.");
    tx.innerHTML = "";

    // index tool_results by tool_use_id
    const results = {};
    for (const m of history) {
      if (Array.isArray(m.content)) {
        for (const b of m.content) {
          if (b && b.type === "tool_result") results[b.tool_use_id] = b;
        }
      }
    }

    let userTurns = 0, asstTurns = 0, toolCalls = 0, lastRole = null;

    for (const m of history) {
      const content = m.content;

      // user message
      if (m.role === "user") {
        // plain string user prompt, or array with a text block (not just tool_result echoes)
        let userText = null;
        if (typeof content === "string") userText = content;
        else if (Array.isArray(content)) {
          const texts = content.filter(b => b.type === "text").map(b => b.text);
          if (texts.length) userText = texts.join("\n\n");
        }
        if (userText != null && userText.trim() !== "") {
          userTurns++;
          if (lastRole !== "user") tx.appendChild(roleTag("user", "You"));
          lastRole = "user";
          const b = document.createElement("div");
          b.className = "turn";
          b.innerHTML = '<div class="bubble user">' + md(userText) + '</div>';
          tx.appendChild(b);
        }
        // tool_result-only user messages are folded into their tool card — skip
        continue;
      }

      // assistant message
      if (m.role === "assistant" && Array.isArray(content)) {
        const blocks = content.filter(b => b.type === "text" || b.type === "tool_use");
        if (!blocks.length) continue;
        asstTurns++;
        if (lastRole !== "assistant") tx.appendChild(roleTag("asst", "Microclaw"));
        lastRole = "assistant";
        const wrap = document.createElement("div");
        wrap.className = "turn";
        for (const b of content) {
          if (b.type === "text" && b.text && b.text.trim()) {
            const el = document.createElement("div");
            el.className = "bubble asst";
            el.innerHTML = md(b.text);
            wrap.appendChild(el);
          } else if (b.type === "tool_use") {
            toolCalls++;
            wrap.appendChild(toolCard(b, results[b.id]));
          }
        }
        tx.appendChild(wrap);
      }
    }

    // stats + chrome
    $("s-turns").textContent = userTurns + asstTurns;
    $("s-tools").textContent = toolCalls;
    $("stats").classList.remove("hidden");
    $("expand").classList.remove("hidden");
    $("collapse").classList.remove("hidden");
    drop.classList.add("hidden");
    $("openlbl").firstChild.textContent = "Open another ";
    $("foot").classList.remove("hidden");
    $("foot").textContent = `${userTurns} user · ${asstTurns} assistant messages · ${toolCalls} tool calls`;
  }

  function showError(msg) {
    drop.classList.remove("hidden", "hot");
    drop.innerHTML = '<div class="big">Couldn\'t read that file</div>' +
      '<p>' + esc(msg) + '</p>' +
      '<p class="hint">Expected a microclaw history JSON — an array of chat messages.</p>' +
      '<label class="filebtn primary" tabindex="0" role="button">Try another file' +
      '<input type="file" accept=".json,application/json" onchange="window.__load(this.files[0])"></label>';
  }

  // ---- file loading ----
  function load(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try { render(JSON.parse(r.result)); window.scrollTo({ top: 0 }); }
      catch (e) { showError(e.message); }
    };
    r.readAsText(file);
  }
  window.__load = load;
  $("file").addEventListener("change", (e) => load(e.target.files[0]));

  // drag & drop
  ["dragenter", "dragover"].forEach(ev =>
    document.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("hot"); }));
  ["dragleave", "drop"].forEach(ev =>
    document.addEventListener(ev, (e) => { e.preventDefault(); if (ev === "drop" || e.target === drop) drop.classList.remove("hot"); }));
  document.addEventListener("drop", (e) => {
    e.preventDefault(); drop.classList.remove("hot");
    if (e.dataTransfer.files.length) load(e.dataTransfer.files[0]);
  });

  // expand / collapse all
  $("expand").addEventListener("click", () => tx.querySelectorAll("details.tool").forEach(d => d.open = true));
  $("collapse").addEventListener("click", () => tx.querySelectorAll("details.tool").forEach(d => d.open = false));

  // ---- embedded data (populated by `microclaw view-history`) ----
  // The standalone template still holds the substitution token, which isn't
  // valid JSON — so parse-and-render, and only surface an error when the content
  // actually looks like history (starts with '[' / '{'), otherwise keep the drop
  // zone. This deliberately avoids comparing against the token string, so the
  // CLI's blind text substitution can't clobber this guard.
  const embed = $("history-data");
  const raw = embed ? embed.textContent.trim() : "";
  if (raw) {
    try { render(JSON.parse(raw)); }
    catch (e) {
      if (raw[0] === "[" || raw[0] === "{") showError("Embedded history was malformed: " + e.message);
    }
  }
})();
</script>
