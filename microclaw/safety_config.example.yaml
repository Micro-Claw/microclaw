# ─── READ THIS BEFORE YOU RUN ANYTHING ────────────────────────────────────────
#
# Every limit in this file is FICTIONAL. It matches no real microscope. These
# limits are the last thing standing between the AI and your hardware, and they
# are enforced before every tool call.
#
# Microclaw REFUSES TO START until you have gone through this file, set each
# limit for THIS instrument, and changed the line below to `reviewed: true`.
#
# Schema 2 adds reviewed per-rig property decisions. The stage and named_stages
# ranges below are themselves the declared stage-position actuator set.
# Migrate schema 1 allowed_properties into categorical_properties below only
# after reviewing each as discrete; use excluded_properties to remove a pair.
schema_version: 2
reviewed: false
rig_profile:
  # Guaranteed mode is the normal fail-closed mode. The only alternative is
  # degraded_trusted_plugins, which explicitly suspends the completeness claim.
  mode: guaranteed
  # Required in guaranteed mode, even when empty. Listing a pair is the reviewed
  # assertion that it is categorical/discrete, not a continuous actuator, and
  # also supplies the runtime allowlist for set_device_property.
  categorical_properties: []
  # categorical_properties:
  #   - {device: DWheel, property: Label}
  #   - {device: DCam, property: Binning}
  # Removed from every write path by the Stage-B authorization map. These are
  # exclusions, not legacy forbidden_properties denylist entries.
  excluded_properties:
    - {device: Core, property: Initialize}
#
# ──────────────────────────────────────────────────────────────────────────────

# All values are in micrometers unless noted.
# Each declared axis needs both edges; use {unbounded: true, reason: "..."} for
# a deliberately open edge. This preserves the review reason; it is not a
# guarantee that the reachable hardware is contained (design/33 validates that).

stage:
  x_min: -5000.0
  x_max:  5000.0
  y_min: -5000.0
  y_max:  5000.0
  z_min:  0.0
  z_max:  200.0

camera:
  max_exposure_ms: 5000.0

# Optional rig-measured validity gate for focus metrics. Do not copy a value
# from another microscope; produce a calibration artifact from confirmed dark
# and illuminated controls first. Omit to retain the visibly uncalibrated
# package fallback.
analysis:
  # min_snr: 5.0

channels:
  # If present, only these presets may be set via set_channel.
  # Remove the list entirely to allow all channels.
  allowed: [DAPI, FITC, TRITC, Brightfield]

# Illumination gate (design/14 §3). Anything that emits light at the sample.
# Shutter enables listed here block on a human confirmation before turning on,
# and are driven to off_value when the session exits (any exit path).
# Power writes are capped (max_power_percent) and ratcheted
# (max_power_step_factor: refuse >N× increase in a single write).
illumination:
  require_confirm_on_enable: true
  # max_power_percent: 30.0
  # max_power_step_factor: 3.0        # 1% -> 25% is 25x: refused
  shutters: []
  # shutters:
  #   - {device: Luxx405,   property: Laser Operation Select, on_value: "On", off_value: "Off"}
  #   - {device: Luxx488,   property: Laser Operation Select, on_value: "On", off_value: "Off"}
  #   - {device: Luxx638,   property: Laser Operation Select, on_value: "On", off_value: "Off"}
  #   - {device: Cobolt561, property: Laser,                  on_value: "On", off_value: "Off"}
  power_properties: []
  # power_properties:
  #   - {device: Luxx405, property: "Laser Power Set-point Select [%]"}
  #   - {device: Luxx488, property: "Laser Power Set-point Select [%]"}
  #   - {device: Luxx638, property: "Laser Power Set-point Select [%]"}

# Per-device travel limits for stages addressed by label via move_named_stage
# (design/14 §6). FAIL-CLOSED: a stage with no entry here cannot be moved by
# name at all. The global stage.z_min/z_max above applies only to the core
# focus device.
named_stages: []
# named_stages:
#   - {device: PIZStage,   min_um: 0.0,     max_um: 200.0}
#   - {device: TIRF Stage, min_um: -3000.0, max_um: 3000.0}

# OPTIONAL filesystem sandbox for every tool that takes a path from the model:
# the acquisitions' save_dir, the adaptive hooks' log_path, and
# read_hook_from_file / read_hook_log / save_position_list / load_position_list /
# export_dataset_as_tiff. Unset — the default — means unrestricted: save data
# wherever you like. Set it only if you want the agent confined to one tree;
# `..` and symlink escapes are then rejected, and an out-of-workspace save_dir is
# refused BEFORE the acquisition moves any hardware.
#
# If you set this, make it the directory your data actually lives in — not
# ~/.microclaw, which is microclaw's own state (hooks, knowledge.yaml).
#
# `microclaw serve`'s artifact downloads do NOT need this. They are authorised
# per-file, against the paths tools declared during the session.
# workspace_dir: /data/microclaw

# Micro-Manager plugin hooks (see design/09). Plugin code is arbitrary Java that
# bypasses the checks above, so it has its own two gates.
plugins:
  # Analyzer (read-only) plugins are allowed by default; list only the
  # fully-qualified classpaths to forbid. Normally empty.
  blocked: []
  # Hardware-motion plugins (e.g. autofocus) are gated behind this single flag,
  # NOT a per-plugin list. Default off; a human flips it to opt in. The AI cannot
  # edit this file.
  allow_hardware_motion: false
