# ─── READ THIS BEFORE YOU RUN ANYTHING ────────────────────────────────────────
#
# Every limit in this file is FICTIONAL. It matches no real microscope. These
# limits are the last thing standing between the AI and your hardware, and they
# are enforced before every tool call.
#
# Microclaw REFUSES TO START until you have gone through this file, set each
# limit for THIS instrument, and changed the line below to `reviewed: true`.
#
# Schema 2 adds reviewed per-rig property decisions. The stage and named_stages
# ranges below are themselves the declared stage-position actuator set.
# Migrate schema 1 allowed_properties into categorical_properties below only
# after reviewing each as discrete; use excluded_properties to remove a pair.
schema_version: 2
reviewed: false
rig_profile:
  # Guaranteed mode is the normal fail-closed mode. The only alternative is
  # degraded_trusted_plugins, which explicitly suspends the completeness claim.
  mode: guaranteed
  # Required in guaranteed mode, even when empty. Listing a pair is the reviewed
  # assertion that it is categorical/discrete, not a continuous actuator, and
  # also supplies the runtime allowlist for set_device_property.
  #
  # You do NOT need to list a filter wheel, slider, or turret here: any device
  # Micro-Manager types as a StateDevice has its own Label/State auto-classified
  # as categorical at startup (`microclaw authorization-map` shows those entries
  # with "source": "auto:state-device"). Nothing else on such a device is
  # admitted, and a shutter is never auto-classified -- Core.Shutter, an MM
  # ShutterDevice, and anything under `illumination` below stay on the
  # illumination gate. List a pair here for every OTHER discrete property.
  #
  # Auto-classification fills vacuums only: naming a device's Label OR State
  # here (or under excluded_properties) means you own BOTH. Declare the one you
  # will actually write and the other stays refused -- so if you are unsure
  # whether a driver takes Label (string) or State (int), declaring one does not
  # quietly hand you the other.
  categorical_properties: []
  # Exact raw continuous writes are opt-in and are checked against the live
  # driver's type/writability/range before this file is admitted. Bounds are in
  # canonical units, never inferred from driver technical limits.
  typed_actuators: []
  # typed_actuators:
  #   - device: AuxiliaryZ
  #     property: "Position (um)"
  #     kind: absolute-position
  #     units: um
  #     minimum: 0.0
  #     maximum: 200.0
  #   - device: iBeamSmartCW-1
  #     property: "Power (mW)"
  #     kind: illumination-power
  #     units: native
  #     full_scale: 75.0
  #     minimum: 0.0
  #     maximum: 30.0       # canonical percent; raw 22.5 mW
  #   - device: Camera
  #     property: Gain
  #     kind: bounded-numeric
  #     units: "e-/ADU"      # operator-supplied label; never parsed or converted
  #     minimum: 0.0
  #     maximum: 24.0        # clamp only; no stage bounds or dose ledger effect
  # categorical_properties:
  #   # Worked example: a discrete selector that MM does not type as a
  #   # StateDevice, so it still needs the reviewed declaration.
  #   - {device: LaserSelector, property: Label}
  # Removed from every write path by the Stage-B authorization map. These are
  # exclusions, not legacy forbidden_properties denylist entries.
  excluded_properties:
    - {device: Core, property: Initialize}
#
# ──────────────────────────────────────────────────────────────────────────────

# All values are in micrometers unless noted.
# Each declared axis needs both edges; use {unbounded: true, reason: "..."} for
# a deliberately open edge. This preserves the review reason; it is not a
# guarantee that the reachable hardware is contained (design/33 validates that).

stage:
  x_min: -5000.0
  x_max:  5000.0
  y_min: -5000.0
  y_max:  5000.0
  z_min:  0.0
  z_max:  200.0

camera:
  max_exposure_ms: 5000.0

# Acquisition hard limits and lower human-confirmation thresholds. Bytes are raw camera payload
# estimates (width × height × bytes/pixel × frames), not compressed file size.
acquisition:
  max_frames: 10000
  max_duration_s: 3600
  max_bytes: 50000000000
  max_illuminated_ms: 600000
  # Optional in-process runaway-loop brake. Restarting Microclaw resets this
  # ledger to zero; it is not a sample-lifetime dose guarantee. Unset means no
  # session ledger cap.
  # max_session_illuminated_ms: 1800000
  confirm_above_frames: 500
  confirm_above_duration_s: 300
  # Deprecated and ignored if present; retained only so deployed configs load.
  # confirm_above_bytes: 5000000000
  confirm_above_illuminated_ms: 60000

# Optional rig-measured validity gate for focus metrics. Do not copy a value
# from another microscope; produce a calibration artifact from confirmed dark
# and illuminated controls first. Omit to retain the visibly uncalibrated
# package fallback.
analysis:
  # min_snr: 5.0

# Channel names and their effects are coupled in guaranteed mode. To enable a
# preset, list its name here AND classify every device/property effect it
# expands to: either auto-classified (a StateDevice's own Label/State) or listed
# under rig_profile.categorical_properties above. Otherwise startup refuses it.
# A preset that only moves filter wheels needs no declaration at all.
# channels:
#   allowed: [DAPI]

# Illumination gate (design/14 §3). Anything that emits light at the sample.
# Shutter enables listed here block on a human confirmation before turning on,
# and are driven to off_value when the session exits (any exit path).
# Power writes are capped (max_power_percent) and ratcheted. The ratchet bounds
# the ratio between consecutive parent writes, limiting how fast power climbs,
# not how high it can reach. From zero it does not constrain the first increase;
# the envelope ceiling is then the only bound. It is a runaway backstop, not a
# gradual-ramp mechanism: hooks that want a gradual ramp implement one themselves
# (for example, uv_activation uses step_percent).
illumination:
  require_confirm_on_enable: true
  # max_power_percent: 30.0
  # max_power_step_factor: 3.0        # 1% -> 25% is 25x: refused; 0% -> 25% is not
  shutters: []
  # shutters:
  #   - {device: Luxx405,   property: Laser Operation Select, on_value: "On", off_value: "Off"}
  #   - {device: Luxx488,   property: Laser Operation Select, on_value: "On", off_value: "Off"}
  #   - {device: Luxx638,   property: Laser Operation Select, on_value: "On", off_value: "Off"}
  #   - {device: Cobolt561, property: Laser,                  on_value: "On", off_value: "Off"}
  power_properties: []
  # power_properties:
  #   - {device: Luxx405, property: "Laser Power Set-point Select [%]", units: percent}
  #   - {device: Luxx488, property: "Laser Power Set-point Select [%]"}
  #   - {device: Luxx638, property: "Laser Power Set-point Select [%]", units: percent}
  # Native-unit migration (measured M5 shape): Power (mW) ranges 0..75, so a
  # raw max_power_percent: 100 cap was inoperative. Declare the representation:
  #   - {device: iBeamSmartCW-1, property: "Power (mW)", units: native, full_scale: 75.0}

# Per-device travel limits for stages addressed by label via move_named_stage
# (design/14 §6). FAIL-CLOSED: a stage with no entry here cannot be moved by
# name at all. The global stage.z_min/z_max above applies only to the core
# focus device.
named_stages: []
# named_stages:
#   - {device: PIZStage,   min_um: 0.0,     max_um: 200.0}
#   - {device: TIRF Stage, min_um: -3000.0, max_um: 3000.0}

# OPTIONAL filesystem sandbox for paths microclaw writes or serves to a browser:
# acquisition save roots, hook log outputs, position-list saves, TIFF exports,
# manifests, and declared artifact downloads. Unset — the default — means those
# paths are unrestricted. When set, writes and served files are confined to one
# tree; `..` and symlink escapes are rejected, and an out-of-workspace save_dir
# is refused BEFORE the acquisition moves any hardware. Local file reads are not
# confined by workspace_dir; this is not a sandbox for hook code or plugins.
#
# If you set this, make it the directory your data actually lives in — not
# ~/.microclaw, which is microclaw's own state (hooks, knowledge.yaml).
#
# `microclaw serve` artifact downloads require both a per-session declaration
# and confinement to this workspace when it is configured.
# workspace_dir: /data/microclaw

# Micro-Manager plugin hooks (see design/09). Plugin code is arbitrary Java that
# bypasses the checks above, so it has its own two gates.
plugins:
  # Analyzer (read-only) plugins are allowed by default; list only the
  # fully-qualified classpaths to forbid. Normally empty.
  blocked: []
  # Hardware-motion plugins (e.g. autofocus) are gated behind this single flag,
  # NOT a per-plugin list. Default off; a human flips it to opt in. The AI cannot
  # edit this file.
  allow_hardware_motion: false
