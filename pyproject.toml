[project]
name = "microclaw"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "pycromanager>=1.0.0",
    "ndstorage>=0.1.0",
    "tifffile>=2024.1.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "Pillow>=10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-mock",
]

[project.scripts]
microclaw = "microclaw.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: requires a running Micro-Manager instance (deselect with -m 'not integration')",
]

[tool.setuptools.package-dir]
microclaw = "microclaw"