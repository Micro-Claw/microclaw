[project]
name = "microclaw"
version = "0.1.0"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "pycromanager>=1.0.2",
    "ndstorage>=0.1.0",
    "tifffile>=2024.1.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ilastik = [
    "h5py>=3.10",
]
# `microclaw serve` only. keyring brokers the API key to the OS credential
# store; without it serve falls back to a user-level config file.
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "keyring>=24.0",
]
test = [
    "pytest>=8.0",
    "pytest-mock",
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
microclaw = "microclaw.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: requires a running Micro-Manager instance (deselect with -m 'not integration')",
]

[tool.setuptools.package-dir]
microclaw = "microclaw"

[tool.setuptools.package-data]
microclaw = [
    "history_viewer.html",
    "serve.html",
    "transcript.css",
    "transcript.js",
    "recovery.js",
    "favicon.ico",
    "safety_config.example.yaml",
    "skills/*/*.md",
]
