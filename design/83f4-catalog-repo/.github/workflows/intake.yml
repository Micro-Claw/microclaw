name: Catalog intake
run-name: ${{ github.event.pull_request.title }}
on:
  pull_request_target:
    branches: [main, test]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: catalog-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false
env:
  MICROCLAW_COMMIT: REPLACE_WITH_PINNED_COMMIT
jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - name: Require the reviewed MicroClaw pin
        run: |
          if ! [[ "$MICROCLAW_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Set MICROCLAW_COMMIT to a reviewed full commit SHA; placeholder is forbidden.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: catalog
          fetch-depth: 0
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Micro-Claw/microclaw
          ref: ${{ env.MICROCLAW_COMMIT }}
          path: microclaw-rules
          persist-credentials: false
      - name: Install intake dependencies
        run: python -m pip install cryptography==44.0.2 packaging==24.2
      - name: Read submission as data, check, merge and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}/microclaw-rules
        run: |
          set -euo pipefail
          cd catalog
          git fetch origin "pull/$PR_NUMBER/head"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]]; then
            gh pr comment "$PR_NUMBER" --body 'Refused submission: field **head_sha**. The PR head changed while intake started; its new event will check the current head.'
            exit 0
          fi
          DATA_HEAD="$RUNNER_TEMP/intake-head"
          ready=false
          for attempt in 1 2 3; do
            git fetch origin "$BASE_REF"
            git reset --hard "origin/$BASE_REF"
            checked_base=$(git rev-parse HEAD)
            rm -rf "$DATA_HEAD"
            args=(--environment production)
            if [[ "$BASE_REF" == test ]]; then
              args=(--environment test --roots "$PWD/roots-TEST-ONLY.json")
            fi
            # Overlay only the PR's merge-base diff on this fresh base, as blobs.
            set +e
            python -m microclaw.catalog_intake materialize --git-dir "$PWD" --base-ref "$checked_base" --head-sha "$HEAD_SHA" --out "$DATA_HEAD" > "$RUNNER_TEMP/verdict.md"
            verdict=$?
            # Record the change set intake judged, so the run log is evidence on its own. The
            # file stays plain text: on a refusal it is the PR comment.
            cat "$RUNNER_TEMP/verdict.md"
            if [[ "$verdict" == 0 ]]; then
              python -m microclaw.catalog_intake check --base "$PWD" --head "$DATA_HEAD" "${args[@]}" > "$RUNNER_TEMP/verdict.md"
              verdict=$?
            fi
            set -e
            # Recheck movement even on refusal: the new policy/base may change the verdict.
            git fetch origin "$BASE_REF"
            if [[ "$(git rev-parse "origin/$BASE_REF")" != "$checked_base" ]]; then
              if [[ "$attempt" == 3 ]]; then
                gh pr comment "$PR_NUMBER" --body 'The base branch moved again. Intake stopped after three tries; re-run this job once the base is stable.'
                exit 1
              fi
              gh pr comment "$PR_NUMBER" --body "The base branch moved. Intake will be re-run against the updated base (attempt $((attempt + 1)) of 3)."
              continue
            fi
            if [[ "$verdict" != 0 ]]; then
              gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/verdict.md"
              if [[ "$verdict" == 2 ]]; then exit 2; fi
              exit 0
            fi
            ready=true
            break
          done
          if [[ "$ready" != true ]]; then exit 1; fi
          # SHA precondition prevents a synchronize race from merging an unchecked head.
          gh api --method PUT "repos/$GH_REPO/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$HEAD_SHA" > "$RUNNER_TEMP/merge.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["merged"], "PR was not merged"' "$RUNNER_TEMP/merge.json"
          git fetch origin "$BASE_REF"
          git reset --hard "origin/$BASE_REF"
          python -m microclaw.catalog_intake build --root "$PWD" "${args[@]}"
          git config user.name 'catalog intake'
          git config user.email 'catalog-intake@users.noreply.github.com'
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild verified package catalog'
            git push origin "HEAD:$BASE_REF"
          fi
